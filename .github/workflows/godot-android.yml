name: Godot Android APK

on:
  push:
    branches: [ "godot-3d-prototype" ]
    paths:
      - "godot/**"
      - ".github/workflows/godot-prototype.yml"
      - ".github/workflows/godot-android.yml"
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

      - name: Install Godot 4.4.1 and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q Godot_v4.4.1-stable_export_templates.tpz -d "$TEMPLATE_DIR"
          if [ -d "$TEMPLATE_DIR/templates" ]; then
            mv "$TEMPLATE_DIR"/templates/* "$TEMPLATE_DIR"/
            rmdir "$TEMPLATE_DIR/templates"
          fi
          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"

      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

      - name: Verify Android toolchain
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          cat "$HOME/.config/godot/editor_settings-4.4.tres"
          adb start-server
          adb version

      - name: Create Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          test -s "$HOME/.android/debug.keystore"

      - name: Extract and stage Kenney 3D models
        run: |
          set -e
          for pack in suburban industrial commercial roads; do
            archive="$(find "godot/assets/kenney/$pack" -maxdepth 1 -type f -name '*.zip' -print -quit)"
            test -n "$archive"
            mkdir -p "godot/assets/kenney/$pack/extracted"
            unzip -oq "$archive" -d "godot/assets/kenney/$pack/extracted"
            mkdir -p "godot/assets/kenney_runtime/$pack"
            find "godot/assets/kenney/$pack/extracted" -type f -iname '*.glb' -exec cp -f {} "godot/assets/kenney_runtime/$pack/" \;
            echo "$pack: $(find "godot/assets/kenney_runtime/$pack" -maxdepth 1 -type f -name '*.glb' | wc -l) GLB models staged"
          done
          test -s godot/assets/kenney_runtime/roads/road-straight.glb
          test -s godot/assets/kenney_runtime/suburban/tree-large.glb
          test -s godot/assets/kenney_runtime/suburban/building-type-a.glb
          test -s godot/assets/kenney_runtime/industrial/building-a.glb
          test -s godot/assets/kenney_runtime/commercial/building-a.glb

      - name: Validate project
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path godot --quit

      - name: Export debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          cp "$HOME/.android/debug.keystore" "$RUNNER_TEMP/debug.keystore"
          mkdir -p build
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --verbose --path godot --export-debug "Android" ../build/Business-Empire-By-Adi.apk
          test -s build/Business-Empire-By-Adi.apk

      - name: Validate exported APK integrity
        run: |
          set -euo pipefail
          APK="build/Business-Empire-By-Adi.apk"
          test -s "$APK"
          echo "APK size: $(stat -c%s "$APK") bytes"
          file "$APK"
          unzip -tq "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Business-Empire-Android-APK
          path: build/Business-Empire-By-Adi.apk
          if-no-files-found: error
