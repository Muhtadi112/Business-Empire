name: Godot Android APK

on:
  push:
    branches: [ "godot-3d-prototype" ]
    paths:
      - "godot/**"
      - "logo.jpg"
      - "loading_screen.mp4"
      - ".github/workflows/godot-prototype.yml"
      - ".github/workflows/godot-android.yml"
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

      - name: Install Godot 4.4.1 and export templates
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q Godot_v4.4.1-stable_export_templates.tpz -d "$TEMPLATE_DIR"
          if [ -d "$TEMPLATE_DIR/templates" ]; then
            mv "$TEMPLATE_DIR"/templates/* "$TEMPLATE_DIR"/
            rmdir "$TEMPLATE_DIR/templates"
          fi
          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"

      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

      - name: Verify Android toolchain
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          cat "$HOME/.config/godot/editor_settings-4.4.tres"
          adb start-server
          adb version

      - name: Create Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          test -s "$HOME/.android/debug.keystore"

      - name: Extract and stage Kenney 3D models
        run: |
          set -euo pipefail
          for pack in suburban industrial commercial roads; do
            archive="$(find "godot/assets/kenney/$pack" -maxdepth 1 -type f -name '*.zip' -print -quit)"
            test -n "$archive"
            mkdir -p "godot/assets/kenney/$pack/extracted"
            unzip -oq "$archive" -d "godot/assets/kenney/$pack/extracted"
            mkdir -p "godot/assets/kenney_runtime/$pack"
            find "godot/assets/kenney/$pack/extracted" -type f -iname '*.glb' -exec cp -f {} "godot/assets/kenney_runtime/$pack/" \;
            echo "$pack: $(find "godot/assets/kenney_runtime/$pack" -maxdepth 1 -type f -name '*.glb' | wc -l) GLB models staged"
          done
          test -s godot/assets/kenney_runtime/roads/road-straight.glb
          test -s godot/assets/kenney_runtime/suburban/tree-large.glb
          test -s godot/assets/kenney_runtime/suburban/building-type-a.glb
          test -s godot/assets/kenney_runtime/industrial/building-a.glb
          test -s godot/assets/kenney_runtime/commercial/building-a.glb

      - name: Prepare logo, app icons, and loading video
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          mkdir -p godot/assets/branding
          test -s logo.jpg
          test -s loading_screen.mp4
          cp logo.jpg godot/assets/branding/logo.jpg
          ffmpeg -y -i loading_screen.mp4 -an -c:v libtheora -q:v 7 godot/assets/branding/loading_screen.ogv
          ffmpeg -y -ss 0.5 -i loading_screen.mp4 -frames:v 1 -q:v 2 godot/assets/branding/loading_poster.jpg
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 loading_screen.mp4 | awk '{printf "%.3f", $1}' > godot/assets/branding/loading_duration.txt
          ffmpeg -y -i logo.jpg -vf "scale=192:192:force_original_aspect_ratio=decrease,pad=192:192:(ow-iw)/2:(oh-ih)/2:color=#101820" -frames:v 1 godot/assets/branding/app_icon_192.png
          ffmpeg -y -i logo.jpg -vf "scale=432:432:force_original_aspect_ratio=decrease,pad=432:432:(ow-iw)/2:(oh-ih)/2:color=#101820" -frames:v 1 godot/assets/branding/app_icon_432.png
          ffmpeg -y -f lavfi -i "color=c=#101820:s=432x432" -frames:v 1 godot/assets/branding/app_icon_bg_432.png
          test -s godot/assets/branding/logo.jpg
          test -s godot/assets/branding/loading_screen.ogv
          test -s godot/assets/branding/loading_poster.jpg
          test -s godot/assets/branding/loading_duration.txt
          test -s godot/assets/branding/app_icon_192.png
          test -s godot/assets/branding/app_icon_432.png
          test -s godot/assets/branding/app_icon_bg_432.png

      - name: Import resources and reject script or branding errors
        run: |
          set -euo pipefail
          mkdir -p build
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path godot --quit 2>&1 | tee build/godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Error opening file 'res://assets/branding/" build/godot-import.log; then
            echo "Godot resource or script validation failed."
            exit 1
          fi

      - name: Run gameplay scene smoke test
        run: |
          set -euo pipefail
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --quit-after 3 res://scenes/main.tscn 2>&1 | tee build/gameplay-smoke-test.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" build/gameplay-smoke-test.log; then
            echo "Gameplay scene failed to initialize."
            exit 1
          fi

      - name: Export debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          cp "$HOME/.android/debug.keystore" "$RUNNER_TEMP/debug.keystore"
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --verbose --path godot --export-debug "Android" ../build/Business-Empire-By-Adi.apk 2>&1 | tee build/android-export.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Error opening file 'res://assets/branding/" build/android-export.log; then
            echo "APK export included a script or branding error."
            exit 1
          fi
          test -s build/Business-Empire-By-Adi.apk

      - name: Verify APK, icon resources, and signature
        run: |
          set -euo pipefail
          APK="build/Business-Empire-By-Adi.apk"
          test -s "$APK"
          echo "APK size: $(stat -c%s "$APK") bytes"
          file "$APK"
          unzip -tq "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          unzip -Z1 "$APK" | grep -q '^res/mipmap-xxxhdpi-v4/icon.png$'
          unzip -Z1 "$APK" | grep -q '^res/mipmap-xxxhdpi-v4/icon_foreground.png$'
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/libgodot_android.so
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Business-Empire-Android-APK
          path: build/Business-Empire-By-Adi.apk
          if-no-files-found: error

          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Business-Empire-Android-APK
          path: build/Business-Empire-By-Adi.apk
          if-no-files-found: error
