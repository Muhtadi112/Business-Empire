name: Android APK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare uploaded brand logo\n        run: |\n          mkdir -p app/src/main/res/drawable-nodpi\n          curl -L --fail --silent --show-error https://raw.githubusercontent.com/Muhtadi112/Business-Empire/main/logo.jpg -o app/src/main/res/drawable-nodpi/business_empire_logo.jpg\n\n      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Business-Empire-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
