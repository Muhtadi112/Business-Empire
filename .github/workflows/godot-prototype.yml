name: Godot 3D Prototype Check

on:
  push:
    branches: [ "godot-3d-prototype" ]
    paths:
      - "godot/**"
      - ".github/workflows/godot-prototype.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.4.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64

      - name: Validate project and GDScript
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path godot --quit

      - name: Package Godot project
        run: zip -qr Business-Empire-Godot-Prototype.zip godot -x "godot/.godot/*"

      - name: Upload prototype source
        uses: actions/upload-artifact@v4
        with:
          name: Business-Empire-Godot-Prototype
          path: Business-Empire-Godot-Prototype.zip
